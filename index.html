<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MRS Ducting Contracts – Invoice &amp; Quotation</title>
<style>
:root{--bg:#eceef3;--card:#fff;--inp:#f4f5f9;--tx:#1b2033;--mut:#667086;--bd:#dadde8;--pri:#232850;--ptx:#fff;--side:#1a1e3d;--acc:#c0313f;--red:#9c2230;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#0f1224;--card:#181c33;--inp:#0f1226;--tx:#e8eaf6;--mut:#9aa1c0;--bd:#2a3050;--pri:#8d99ee;--ptx:#0e1128;--side:#090b1b;--acc:#e0505e;--red:#e0505e}}
*{box-sizing:border-box}
html{scroll-padding-top:60px}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit;cursor:pointer}

/* ---------- shell: left sidebar with 3 feature bars ---------- */
#shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--side);color:#c9d0d8;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));z-index:50;overflow-y:auto}
.brand{padding:2px 4px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.brand .lp{background:#fff;border-radius:12px;padding:10px 14px;display:grid;place-items:center}
.brand .lp img{display:block;width:100%;max-height:80px;object-fit:contain}
.brand .lp b{color:#232850;font-size:15px;text-align:center}
.brand small{display:block;color:#8e99b3;font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;margin-top:9px;text-align:center}
.sbh{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:#7d8996;padding:0 8px 8px}
.sb{display:flex;align-items:center;gap:12px;width:100%;padding:14px 14px;margin-bottom:8px;border:0;border-left:4px solid transparent;border-radius:9px;background:rgba(255,255,255,.05);color:inherit;font-size:15px;font-weight:600;text-align:left}
.sb:hover{background:rgba(255,255,255,.09)}
.sb.on{background:rgba(255,255,255,.12);border-left-color:var(--acc);color:#fff}
.sb svg{width:21px;height:21px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700;background:var(--acc);color:#fff;border-radius:10px;padding:1px 8px}
aside .foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.09)}
aside .foot .sb{background:none;margin:0}
aside .foot .sb.on{background:rgba(255,255,255,.12)}
#top{display:none}
#scrim{display:none}
@media(max-width:899px){
 #shell{grid-template-columns:1fr}
 aside{position:fixed;left:0;top:0;bottom:0;width:272px;transform:translateX(-102%);transition:transform .22s ease;box-shadow:6px 0 28px rgba(0,0,0,.35)}
 body.open aside{transform:none}
 body.open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45}
 #top{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;background:var(--side);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
 #top b{font-size:16px}
 #hb{border:0;background:rgba(255,255,255,.08);color:#fff;width:42px;height:42px;border-radius:10px;display:grid;place-items:center}
 #hb svg{width:24px;height:24px;stroke:#fff;stroke-width:2.4;stroke-linecap:round;fill:none}
}

/* ---------- main ---------- */
main{padding:24px 22px 40px;max-width:900px;width:100%;margin:0 auto}
.ph{margin-bottom:16px}
.ph h2{margin:0;font-size:24px;letter-spacing:-.2px}
.ph p{margin:3px 0 0;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h3{display:flex;align-items:center;gap:9px;margin:0 0 12px;font-size:15px}
h3:before{content:'';width:4px;height:15px;background:var(--pri);border-radius:2px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:10px;letter-spacing:.2px}
input,textarea,output{display:block;width:100%;margin-top:4px;padding:10px 11px;border:1px solid var(--bd);border-radius:9px;background:var(--inp);color:var(--tx);font:16px system-ui,sans-serif}
input:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:0;border-color:transparent}
output{min-height:43px;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:560px){.g4{grid-template-columns:.8fr .8fr 1fr 1.2fr}}
@media(max-width:480px){.g2.keep{grid-template-columns:1fr}}
.it{background:var(--inp);border:1px solid var(--bd);border-left:4px solid var(--pri);border-radius:10px;padding:10px;margin-bottom:10px}
.it input,.it textarea,.it output{background:var(--card)}
.r1{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:13px}
.b{padding:11px 16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px;font-weight:600}
.b.p{background:var(--pri);color:var(--ptx);border-color:var(--pri)}
.b.s{padding:8px 10px;font-size:13px}
.x{background:none;border:0;color:#d33;font-size:18px}
.lnk{background:none;border:0;color:var(--pri);font-size:13px;font-weight:600;padding:2px 0}
.tot{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin-top:12px;padding-top:12px;border-top:2px solid var(--bd)}
.bar{display:flex;gap:8px;flex-wrap:wrap}.bar .b{flex:1}
.act{position:sticky;bottom:10px;z-index:10;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;box-shadow:0 8px 26px rgba(0,0,0,.18)}
.b.wa{background:#128c7e;border-color:#128c7e;color:#fff}
@media(max-width:560px){.act{flex-wrap:wrap}.act .tl{flex:1 0 100%}.act .b{flex:1;padding:11px 8px}}
.act .tl{flex:1;min-width:0;line-height:1.2}.act .tl small{display:block;color:var(--mut);font-size:11px;letter-spacing:.8px;text-transform:uppercase}.act .tl b{font-size:18px;white-space:nowrap}
.sv{border:1px solid var(--bd);border-left:4px solid var(--pri);border-radius:12px;background:var(--card);padding:12px;margin-bottom:10px}
.sv.q{border-left-color:var(--red)}
.sv .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}
.sv .amt{font-weight:700;white-space:nowrap}
.sv small{color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--pri);color:var(--ptx);margin-right:7px;letter-spacing:.5px}
.sv.q .tag{background:var(--red);color:#fff}
#wab{position:fixed;left:10px;right:10px;bottom:14px;background:#128c7e;color:#fff;padding:10px 12px;border-radius:12px;z-index:140;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
#wab[hidden]{display:none}#wab a{color:#fff;font-weight:700}#wab button{background:none;border:0;color:#fff;font-size:18px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;z-index:150;max-width:90vw;text-align:center}
#pv{position:fixed;inset:0;background:#7f8790;overflow:auto;z-index:100;padding:10px}
#pv[hidden],#toast[hidden]{display:none}
.tb{display:flex;gap:8px;max-width:794px;margin:0 auto 10px}.tb .b{flex:1}

/* ---------- printed / PDF sheet (MRS Ducting format, always full A4) ---------- */
@page{size:A4;margin:0}
#sheet{background:#fff;color:#1b2033;width:210mm;min-height:296mm;margin:auto;padding:0;font:12.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
#sheet .sh-top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:9mm 12mm 6mm}
#sheet .sh-co h1{margin:0;font-size:24px;color:#232850;letter-spacing:.3px}
#sheet .sh-co img{display:block;height:23mm;max-width:95mm;object-fit:contain;object-position:left}
#sheet .sh-sm{white-space:pre-line}
#sheet .sh-co .sh-sm{color:#5b6378;margin-top:5px;font-size:11.5px}
#sheet .sh-ti{text-align:right}
#sheet .sh-ti b{display:block;font-size:30px;letter-spacing:6px;color:#232850;line-height:1.1}
#sheet .sh-ti .rb{display:block;width:46px;height:4px;background:#9c2230;margin:7px 0 0 auto}
#sheet .sh-ti span{display:block;font-size:12.5px;color:#5b6378;margin-top:7px}
#sheet .sh-stripe{height:6px;background:linear-gradient(90deg,#232850 0,#232850 78%,#9c2230 78%,#9c2230 100%)}
#sheet .sh-body{flex:1;display:flex;flex-direction:column;padding:7mm 12mm 6mm}
#sheet .sh-info{display:grid;grid-template-columns:1.4fr 1fr;gap:10px;margin-bottom:6mm}
#sheet .bx{background:#f3f4f9;border-left:3px solid #9c2230;padding:8px 11px;min-width:0}
#sheet .bx label{display:block;font-size:9.5px;letter-spacing:1.5px;color:#667086;margin:0 0 4px;font-weight:700}
#sheet .bx strong{font-size:14px;display:block}
#sheet .bx .sh-sm{color:#454d60;font-size:12px}
#sheet .kv{display:flex;justify-content:space-between;gap:8px;font-size:12px;padding:1px 0}
#sheet .kv span{color:#667086}
#sheet .sh-items{flex:1;display:flex;flex-direction:column;border:1px solid #cdd1df;min-height:70mm}
#sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
#sheet thead th{background:#232850;color:#fff;text-align:left;padding:7px 8px;font-size:10.5px;letter-spacing:.8px;font-weight:600}
#sheet td{padding:7px 8px;border-bottom:1px solid #e4e7ef;border-right:1px solid #e4e7ef;vertical-align:top;word-break:break-word}
#sheet td:last-child{border-right:0}
#sheet .n{text-align:right;white-space:nowrap}
#sheet .sh-fill{flex:1;display:flex;min-height:6mm}
#sheet .sh-fill i{display:block;border-right:1px solid #e4e7ef}
#sheet .sh-fill i:last-child{border-right:0}
#sheet .sh-tot{display:flex;gap:12px;align-items:stretch;margin-top:5mm}
#sheet .wd{flex:1;border:1px dashed #b6bccd;padding:8px 11px;min-width:0}
#sheet .wd label{display:block;font-size:9.5px;letter-spacing:1.5px;color:#667086;margin:0 0 3px;font-weight:700}
#sheet .gt{min-width:215px;background:#232850;color:#fff;padding:8px 14px;display:flex;flex-direction:column;justify-content:center;border-bottom:4px solid #9c2230}
#sheet .gt span{font-size:10px;letter-spacing:1.4px;font-weight:700;color:#c9cdea}
#sheet .gt b{font-size:20px}
#sheet .sh-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:5mm}
#sheet .sh-2 h4{margin:0 0 3px;font-size:10px;letter-spacing:1.5px;color:#667086;text-transform:uppercase}
#sheet .sh-2 .sh-sm{color:#2a3042}
#sheet .sg{padding-top:20px;align-self:flex-end;text-align:center;min-width:230px}
#sheet .fo{font-weight:700;margin-bottom:6px}
#sheet .ln{border-top:2px solid #232850;padding-top:4px;font-size:12px}
#sheet.mp .sh-items{flex:none;min-height:0}#sheet.mp .sh-fill{display:none}#sheet.mp .sg{margin-top:auto}#sheet.mp .sg{padding-top:6px}#sheet.mp .sg img{height:42px!important}#sheet.mp .sg div[style*='height:56px']{height:32px!important}#sheet.mp .sh-tot{margin-top:4mm}#sheet.mp .sh-2{margin-top:4mm}
#sheet .sh-ft{border-top:3px solid #9c2230;background:#232850;color:#aab0d4;text-align:center;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;padding:7px}
@media print{#sheet tr,#sheet .sh-tot,#sheet .sh-2,#sheet .sg{break-inside:avoid;page-break-inside:avoid}#sheet thead{display:table-header-group}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}html,body{margin:0!important;padding:0!important;background:#fff!important;height:auto!important}body>*:not(#pv){display:none!important}#pv{position:static!important;inset:auto!important;overflow:visible!important;height:auto!important;background:none!important;padding:0!important}.tb{display:none!important}#sheet{zoom:1!important;margin:0!important;box-shadow:none!important;width:210mm!important}:root{padding:0}}
/* ---------- cloud sync ---------- */
#login{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}
#login[hidden]{display:none}
#login form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.12)}
#login .lg{background:#fff;border-radius:12px;padding:10px;text-align:center;margin-bottom:16px;border:1px solid var(--bd)}
#login .lg img{height:62px;max-width:100%}
#login h2{margin:0 0 3px;font-size:20px}
#login p{margin:0 0 14px;color:var(--mut);font-size:13.5px}
#login .err{color:#d33;font-size:13px;min-height:18px;margin:2px 0 10px}
#login .b{width:100%}
#login .lnk{display:block;margin:12px auto 0}
.sync{font-size:12px;color:#aab0d4;padding:2px 6px 12px;line-height:1.35;word-break:break-all}
.sync .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#7a809e;margin-right:6px}
.sync .dot.on{background:#3ecf8e}
.sync button{background:none;border:0;color:#fff;text-decoration:underline;font-size:12px;padding:0;margin-left:6px}
</style></head><body>

<aside id="side"></aside>
<div>
<div id="top"><button id="hb" aria-label="Open menu" onclick="menu()"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><b id="ttl">MR Ducting</b></div>
<main id="app"></main>
</div>
</div>
<div id="scrim" onclick="menu(false)"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBOrCDS5txmcVtBBOefeTHBarfb1VvQFWA",
  authDomain: "mr-duct.firebaseapp.com",
  projectId: "mr-duct",
  storageBucket: "mr-duct.firebasestorage.app",
  messagingSenderId: "686627807376",
  appId: "1:686627807376:web:45c821cd4bf34a3574f815",
  measurementId: "G-S60YE3MFG8"
};
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
let stops=[];
const clean=o=>JSON.parse(JSON.stringify(o));
window.CLOUD={user:null,
 login:(e,p)=>signInWithEmailAndPassword(auth,e,p),
 logout:()=>signOut(auth),
 saveDoc:d=>setDoc(doc(db,'invoices',String(d.id)),clean(d)),
 delDoc:id=>deleteDoc(doc(db,'invoices',String(id))),
 saveCfg:(k,o)=>setDoc(doc(db,'config',k),clean(o))};
onAuthStateChanged(auth,u=>{
 stops.forEach(f=>f());stops=[];
 CLOUD.user=u?{email:u.email,uid:u.uid}:null;
 if(u){
  stops.push(onSnapshot(collection(db,'invoices'),s=>window.cloudDocs(s.docs.map(x=>x.data())),e=>window.cloudErr(e)));
  stops.push(onSnapshot(collection(db,'config'),s=>{const o={};s.forEach(x=>o[x.id]=x.data());window.cloudCfg(o,s.metadata.hasPendingWrites)},e=>window.cloudErr(e)));
 }
 window.cloudChanged();
});
</script>

let S={set:{},docs:[]};

S.set=Object.assign({},D,S.set);S.q=S.q||{};

const sv=()=>{loc();pushSetSoon()};
const pad=n=>String(n).padStart(4,'0');
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const tot=d=>d.items.reduce((s,x)=>s+(+x.q||0)*(+x.r||0),0);

/* amount in words (Indian numbering) */
const ON=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],
TN=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
const w99=n=>n<20?ON[n]:TN[Math.floor(n/10)]+(n%10?' '+ON[n%10]:'');
const w999=n=>[n>=100?ON[Math.floor(n/100)]+' Hundred':'',n%100?w99(n%100):''].filter(Boolean).join(' ');
function words(n){if(n===0)return 'Zero';const o=[],cr=Math.floor(n/1e7);n%=1e7;const la=Math.floor(n/1e5);n%=1e5;const th=Math.floor(n/1e3);n%=1e3;
if(cr)o.push(words(cr)+' Crore');if(la)o.push(w99(la)+' Lakh');if(th)o.push(w99(th)+' Thousand');if(n)o.push(w999(n));return o.join(' ')}
function amtWords(v,c){const r=Math.round((+v||0)*100),rs=Math.floor(r/100),ps=r%100;
const U={'₹':['Rupee','Rupees','Paisa','Paise'],'$':['Dollar','Dollars','Cent','Cents'],'€':['Euro','Euros','Cent','Cents'],'£':['Pound','Pounds','Penny','Pence'],'AED':['Dirham','Dirhams','Fil','Fils']}[(c||'').trim()]||['','','',''];
let t=(words(rs)+' '+U[rs==1?0:1]).trim();if(ps)t+=' and '+(words(ps)+' '+U[ps==1?2:3]).trim();return t+' Only'}

items:[{d:'',u:'Nos',q:1,r:''}],terms:i?s.it:s.qt,notes:i?s.inn:s.qnn}}

${i?`<label>Quotation / PO No.<input value="${E(d.ref)}" oninput="cur.ref=this.value"></label>`:''}</div>
<div class="card"><h3>Client</h3>

function row(x,i){return`<div class="it"><div class="r1"><b>Item ${i+1}</b>${cur.items.length>1?`<button class="x" aria-label="Remove item" onclick="delI(${i})">✕</button>`:''}</div>
<textarea rows="2" placeholder="Description" oninput="up(${i},'d',this.value)">${E(x.d)}</textarea>
<div class="g4"><label>Unit<input value="${E(x.u)}" oninput="up(${i},'u',this.value)"></label>
<label>Qty<input type="number" inputmode="decimal" value="${E(x.q)}" oninput="up(${i},'q',this.value)"></label>
<label>Rate<input type="number" inputmode="decimal" value="${E(x.r)}" oninput="up(${i},'r',this.value)"></label>
<label>Amount<output id="a${i}"></output></label></div></div>`}
function upd(){cur.items.forEach((x,i)=>{const o=$('#a'+i);if(o)o.textContent=fmt((+x.q||0)*(+x.r||0))});const t=S.set.cur+' '+fmt(tot(cur));$('#tt').textContent=t;$('#tt2').textContent=t}
function up(i,k,v){cur.items[i][k]=v;upd()}
function addI(){cur.items.push({d:'',u:'Nos',q:1,r:''});$('#its').innerHTML=cur.items.map(row).join('');upd()}
function delI(i){cur.items.splice(i,1);$('#its').innerHTML=cur.items.map(row).join('');upd()}
function useDef(k){cur[k]=S.set[DM[tab][k]];if(k=='terms')cur.tt=0;else cur.nt=0;render();toast('Default applied')}
function save(q){const i=cur.t=='i',s=S.set;let bumped=0;
if(!cur.id){
 if(S.docs.some(x=>x.t==cur.t&&x.no==cur.no)){const p=i?s.ip:s.qp,used=new Set(S.docs.filter(x=>x.t==cur.t).map(x=>x.no));let n=i?s.in:s.qn;while(used.has(p+pad(n)))n++;cur.no=p+pad(n);if(i)s.in=n;else s.qn=n;bumped=1}
 cur.id=Date.now();if(i)s.in++;else s.qn++}
const c=JSON.parse(JSON.stringify(cur)),k=S.docs.findIndex(d=>d.id==c.id);
if(k>=0)S.docs[k]=c;else S.docs.push(c);sv();mark(c.id,'s');
if(!q){toast(bumped?'Number was already used - saved as '+cur.no:'Saved',bumped?3500:0);render()}}
function nw(){dr[tab]=null;cur=dr[tab]=newDoc(tab);render()}

function hist(){const l=S.docs.slice().sort((a,b)=>b.id-a.id);
return`<div class="ph"><h2>Saved documents</h2><p>${l.length} saved · stored on this device</p></div>`+(l.length?l.map(d=>`<div class="sv ${d.t=='q'?'q':''}"><div class="top"><div style="min-width:0"><span class="tag">${d.t=='i'?'INV':'QT'}</span><b>${E(d.no)}</b><br><small>${E(d.client||'—')} · ${d.date.split('-').reverse().join('-')}</small></div><div class="amt">${E(S.set.cur)} ${fmt(tot(d))}</div></div>
<div class="bar"><button class="b s" onclick="openD(${d.id})">Edit</button><button class="b s" onclick="pdfD(${d.id})">PDF</button><button class="b s" onclick="waD(${d.id})">WhatsApp</button><button class="b s" id="d${d.id}" onclick="delD(${d.id})">Delete</button></div></div>`).join(''):'<div class="card">No saved documents yet.</div>')}
function openD(id){const d=S.docs.find(x=>x.id==id);dr[d.t]=JSON.parse(JSON.stringify(d));go(d.t);toast('Editing '+d.no+' - tap Save to update')}
function delD(id){const b=$('#d'+id);if(b.dataset.s){S.docs=S.docs.filter(x=>x.id!=id);sv();mark(id,'d');render()}else{b.dataset.s=1;b.textContent='Sure?'}}

function sigSet(v){S.set.sig=v;sv();render();toast('Signature updated')}
function sigUp(inp){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const w=Math.min(500,im.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);sigSet(c.toDataURL('image/png'))};im.src=URL.createObjectURL(f)}
const sigSrc=()=>{const g=S.set.sig;return(g=='none'||!g)?'':g};
const logoSrc=()=>{const g=S.set.logo;return g=='default'?LOGO:((g=='none'||!g)?'':g)};
function logoSet(v){S.set.logo=v;sv();render();toast('Logo updated')}
function logoUp(inp){const f=inp.files[0];if(!f)return;const im=new Image();im.onload=()=>{const w=Math.min(700,im.width),c=document.createElement('canvas');c.width=w;c.height=Math.round(im.height*w/im.width);c.getContext('2d').drawImage(im,0,0,c.width,c.height);logoSet(c.toDataURL('image/png'))};im.src=URL.createObjectURL(f)}
function sett(){const s=S.set,f=(l,k,n)=>`<label>${l}<input ${n?'type="number" min="1"':''} value="${E(s[k])}" oninput="S.set.${k}=${n?'+this.value||1':'this.value'};sv()"></label>`,
t=(l,k)=>`<label>${l}<textarea rows="3" oninput="S.set.${k}=this.value;sv()">${E(s[k])}</textarea></label>`;
return`<div class="ph"><h2>Settings</h2><p>Company details, numbering and default wording.</p></div>
<div class="card"><h3>Company</h3>${f('Company name','co')}${f('Address (optional)','addr')}${f('Phone / email (optional)','contact')}${f('Currency symbol','cur')}</div>
<div class="card"><h3>Logo</h3><div style="background:#fff;border:1px solid var(--bd);border-radius:9px;padding:10px;text-align:center;min-height:50px">${logoSrc()?`<img src="${logoSrc()}" style="height:70px;max-width:100%" alt="">`:'<small style="color:#777">No logo (company name is shown instead)</small>'}</div><label style="margin-top:10px">Upload logo image<input type="file" accept="image/*" onchange="logoUp(this)"></label><div class="bar"><button class="b s" onclick="logoSet('default')">Use MRS logo</button><button class="b s" onclick="logoSet('none')">Remove</button></div></div>
<div class="card"><h3>Authorised signature (invoices)</h3><div style="background:#fff;border:1px solid var(--bd);border-radius:9px;padding:6px;text-align:center;min-height:50px">${sigSrc()?`<img src="${sigSrc()}" style="height:60px" alt="">`:'<small style="color:#777">No signature</small>'}</div><label style="margin-top:10px">Upload signature image<input type="file" accept="image/*" onchange="sigUp(this)"></label><div class="bar"><button class="b s" onclick="sigSet('none')">Remove</button></div></div>
<div class="card"><h3>Numbering (auto)</h3><div class="g2">${f('Invoice prefix','ip')}${f('Next invoice no.','in',1)}${f('Quotation prefix','qp')}${f('Next quotation no.','qn',1)}</div></div>
<div class="card"><h3>Default invoice text</h3>${t('Payment terms','it')}${t('Notes','inn')}</div>
<div class="card"><h3>Default quotation text</h3>${t('Payment terms','qt')}${t('Notes','qnn')}</div>
<p style="color:var(--mut);font-size:13px">Defaults apply to new documents. Data is stored in this browser on this device.</p>`}

const info=[s.addr,s.contact].filter(x=>x&&x.trim()).join('\n'),lg=logoSrc(),W=[6,44,9,10,14,17];

${d.items.map((x,k)=>`<tr><td>${k+1}</td><td style="white-space:pre-line">${E(x.d)}</td><td>${E(x.u)}</td><td class="n">${E(x.q)}</td><td class="n">${fmt(x.r)}</td><td class="n">${fmt((+x.q||0)*(+x.r||0))}</td></tr>`).join('')}
</tbody></table><div class="sh-fill">${W.map(w=>`<i style="width:${w}%"></i>`).join('')}</div></div>
<div class="sh-tot"><div class="wd"><label>AMOUNT IN WORDS</label>${E(amtWords(T,c))}</div><div class="gt"><span>TOTAL (${E(c)})</span><b>${fmt(T)}</b></div></div>
${(d.terms.trim()||d.notes.trim())?`<div class="sh-2"><div>${d.terms.trim()?`<h4>Payment terms</h4><div class="sh-sm">${E(d.terms)}</div>`:''}</div><div>${d.notes.trim()?`<h4>Notes</h4><div class="sh-sm">${E(d.notes)}</div>`:''}</div></div>`:''}
${i?`<div class="sg"><div class="fo">For ${E(s.co)}</div>${sigSrc()?`<img src="${sigSrc()}" style="height:60px;display:block;margin:0 auto 4px" alt="">`:`<div style="height:56px"></div>`}<div class="ln">Authorised Signatory</div></div>`:''}
</div>

const fnb=d=>(d.no||'document').replace(/[\\/:*?"<>|]/g,'-');
const getD=id=>id?S.docs.find(x=>x.id==id):cur;
function waF(){save(true);waD()}
function pr(){const t=document.title;document.title=fnb(cur);window.print();setTimeout(()=>document.title=t,1500)}
const PGH=1122.8;
function paginate(el){
 const T=()=>el.getBoundingClientRect().top,rel=n=>n.getBoundingClientRect().top-T(),GAP=16,hdr=el.querySelector('thead tr');
 const fix=(n,row)=>{const t=rel(n),ht=n.getBoundingClientRect().height,k=Math.floor(t/PGH);
  if(t+ht<=(k+1)*PGH-GAP||ht>PGH-2*GAP)return;
  const gap=(k+1)*PGH-t+GAP;
  if(row){const sp=document.createElement('tr');sp.innerHTML=`<td colspan="6" style="height:${gap}px;padding:0;border:0"></td>`;n.before(sp);
   if(hdr){const hr=document.createElement('tr');hr.innerHTML=[...hdr.children].map(c=>`<td style="background:#232850;color:#fff;font-size:10.5px;letter-spacing:.8px;font-weight:600;padding:7px 8px;text-align:${c.classList.contains('n')?'right':'left'}">${c.innerHTML}</td>`).join('');n.before(hr)}}
  else{const sp=document.createElement('div');sp.style.height=gap+'px';n.before(sp)}};
 el.querySelectorAll('tbody tr').forEach(tr=>fix(tr,1));
 ['.sh-tot','.sh-2','.sg'].forEach(s=>{const n=el.querySelector(s);if(n)fix(n,0)})}
async function mkPdf(d){
if(!window.html2pdf)throw new Error('PDF engine did not load. Check internet and reload.');
const el=document.createElement('div');el.id='sheet';el.innerHTML=sheet(d);
el.style.cssText='margin:0;zoom:1;width:794px;min-height:1122px';
const w=document.createElement('div');w.style.cssText='position:absolute;left:0;top:0;width:794px;z-index:-1;pointer-events:none';w.appendChild(el);document.body.appendChild(w);
try{let n=1;
 if(el.scrollHeight>PGH+2){el.classList.add('mp');el.style.minHeight='0';paginate(el);
  let H=el.scrollHeight;const ft=el.querySelector('.sh-ft'),fh=ft?ft.offsetHeight:0;n=Math.ceil((H-1)/PGH);
  if(ft&&n>1&&H-fh<=(n-1)*PGH+2){ft.style.display='none';H=el.scrollHeight;n=Math.ceil((H-1)/PGH)}
  el.style.minHeight=(n*PGH-4)+'px'}
 const sc=n<=3?2:(n<=5?1.5:1.2);
 return await html2pdf().set({margin:0,image:{type:'jpeg',quality:.95},html2canvas:{scale:sc,x:0,y:0,scrollX:0,scrollY:0,width:794,windowWidth:794,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css']}}).from(el).outputPdf('blob')}finally{w.remove()}}
async function saveBlob(b,d){const name=fnb(d)+'.pdf';let dl=null;
try{dl=window.claude&&await claude.use('downloads')}catch(e){}
if(dl){await dl.save({filename:name,data:b});return}
const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
const errM=e=>e&&(e.message||e.code)||'unknown error';
async function pdfD(id){const d=getD(id);toast('Preparing PDF…');
try{const b=await mkPdf(d);await saveBlob(b,d);toast('PDF saved')}catch(e){if(e&&e.code=='declined')return;toast('PDF failed: '+errM(e),4500)}}
function waLink(d){let p=(d.ph||'').replace(/\D/g,'');if(p.length==10)p='91'+p;
const m=`${d.t=='i'?'Invoice':'Quotation'} ${d.no} from ${S.set.co}. Total: ${S.set.cur} ${fmt(tot(d))}`;
return'https://wa.me/'+p+'?text='+encodeURIComponent(m)}
async function waD(id){const d=getD(id);toast('Preparing PDF…');let b;
try{b=await mkPdf(d)}catch(e){toast('PDF failed: '+errM(e),4500);return}
const f=new File([b],fnb(d)+'.pdf',{type:'application/pdf'});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:d.no});return}}catch(e){if(e&&e.name=='AbortError')return}
try{await saveBlob(b,d)}catch(e){if(e&&e.code=='declined')return;toast('PDF failed: '+errM(e),4500);return}
const w=$('#wab');w.innerHTML=`<span>PDF saved. Open WhatsApp and attach it.</span><a href="${waLink(d)}" target="_blank" rel="noopener">Open WhatsApp</a><button onclick="this.parentNode.hidden=true">✕</button>`;w.hidden=false}
function prev(){save(true);$('#pv').innerHTML=`<div class="tb"><button class="b p s" onclick="pr()">Print</button><button class="b s" onclick="pdfD()">Download PDF</button><button class="b s wa" onclick="waD()">Share on WhatsApp</button><button class="b s" onclick="$('#pv').hidden=true">Close</button></div><div id="sheet">${sheet(cur)}</div>`;$('#pv').hidden=false;$('#sheet').style.zoom=Math.min(1,(innerWidth-20)/794)}

/* ---------- cloud sync (Firebase) ---------- */
const cloud=()=>window.CLOUD&&CLOUD.user?CLOUD:null;
let offline=false;
const sq={};let sn=0;
function push(id){const c=cloud();if(!c)return;const a=S.q[id];if(!a)return;const my=sq[id]=++sn,d=S.docs.find(x=>x.id==id);
 const p=a=='d'?c.delDoc(id):(d?c.saveDoc(d):Promise.resolve());
 p.then(()=>{if(sq[id]===my){delete S.q[id];loc()}}).catch(cerr)}
function mark(id,a){S.q[id]=a;loc();push(id)}
function cerr(e){const k=e&&e.code||'';toast(k=='permission-denied'?'Cloud blocked by Firestore rules - check the rules in Firebase console':'Cloud sync error: '+(k||errM(e)),4500)}
window.cloudErr=cerr;
const parts=()=>{const {sig,logo,...rest}=S.set;return{company:rest,signature:{v:sig||'none'},logo:{v:logo||'none'}}};
let lastP={},pt=0;
function pushSet(){const c=cloud();if(!c)return;const P=parts();for(const k in P){const j=JSON.stringify(P[k]);if(lastP[k]!==j){lastP[k]=j;c.saveCfg(k,P[k]).catch(e=>{lastP[k]=null;cerr(e)})}}}
function pushSetSoon(){if(!cloud())return;clearTimeout(pt);pt=setTimeout(pushSet,900)}
window.cloudDocs=function(l){
 const m=new Map(l.map(d=>[String(d.id),d]));
 if(!S.mig){S.docs.forEach(d=>S.q[d.id]='s');S.mig=1}
 for(const [id,a] of Object.entries(S.q)){if(a=='d')m.delete(id);else{const d=S.docs.find(x=>x.id==id);if(d)m.set(id,d)}}
 S.docs=[...m.values()];loc();
 Object.keys(S.q).forEach(push);
 if(tab=='h')render();else renderSide()};
window.cloudCfg=function(o,pending){
 if(!o.company){pushSet();return}
 if(pending)return;
 const keep={sig:S.set.sig,logo:S.set.logo};
 S.set=Object.assign({},D,S.set,o.company,keep);
 if(o.signature&&o.signature.v!=null)S.set.sig=o.signature.v;
 if(o.logo&&o.logo.v!=null)S.set.logo=o.logo.v;
 const P=parts();for(const k in P)lastP[k]=JSON.stringify(P[k]);
 loc();
 const ae=document.activeElement;
 if(tab=='s'&&!(ae&&/INPUT|TEXTAREA/.test(ae.tagName)))render();else renderSide()};
window.cloudChanged=function(){const c=window.CLOUD;
 if(c&&!c.user)lastP={};
 if(c&&c.user)offline=false;
 $('#login').hidden=!c||!!c.user||offline;
 $('#lgl').innerHTML=logoSrc()?`<img src="${logoSrc()}" alt="">`:`<b>${E(S.set.co)}</b>`;
 renderSide()};
function useOffline(){offline=true;$('#login').hidden=true;renderSide()}
function showLogin(){offline=false;$('#login').hidden=false}
const authMsg=e=>({'auth/invalid-credential':'Wrong email or password.','auth/invalid-email':'That email address is not valid.','auth/user-not-found':'No account with that email.','auth/wrong-password':'Wrong email or password.','auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.','auth/network-request-failed':'No internet connection.','auth/operation-not-allowed':'Email/Password sign-in is not enabled in the Firebase console (Authentication > Sign-in method).','auth/user-disabled':'This account is disabled.'}[e&&e.code]||('Sign-in failed: '+(e&&e.code||errM(e))));
async function doLogin(ev){ev.preventDefault();const f=ev.target,b=f.querySelector('button[type=submit]');$('#lerr').textContent='';b.disabled=true;b.textContent='Signing in…';
 try{await CLOUD.login(f.em.value.trim(),f.pw.value);f.pw.value=''}catch(e){$('#lerr').textContent=authMsg(e)}
 b.disabled=false;b.textContent='Sign in';return false}

go('i');
